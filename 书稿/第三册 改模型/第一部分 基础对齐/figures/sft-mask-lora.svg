nt-size="22" font-weight="500" text-anchor="middle">y₂</text><rect x="1125" y="330" width="155" height="62" rx="12" fill="#EAF4EE" stroke="#3D8060" stroke-width="1.6"/><text x="1202.5" y="369.0" fill="#24364A" font-size="22" font-weight="500" text-anchor="middle">y₂</text><rect x="1302" y="200" width="155" height="62" rx="12" fill="#EAF4EE" stroke="#3D8060" stroke-width="1.6"/><text x="1379.5" y="239.0" fill="#24364A" font-size="22" font-weight="500" text-anchor="middle">[结束]</text><rect x="1302" y="330" width="155" height="62" rx="12" fill="#EAF4EE" stroke="#3D8060" stroke-width="1.6"/><text x="1379.5" y="369.0" fill="#24364A" font-size="22" font-weight="500" text-anchor="middle">[结束]</text><path d="M848,263 L1025,328" fill="none" stroke="#3D8060" stroke-width="2.5" marker-end="url(#green)"/><path d="M1025,263 L1202,328" fill="none" stroke="#3D8060" stroke-width="2.5" marker-end="url(#green)"/><path d="M1202,263 L1379,328" fill="none" stroke="#3D8060" stroke-width="2.5" marker-end="url(#green)"/><text x="240" y="295" fill="#617286" font-size="20" font-weight="400" text-anchor="start">位置 t 的输出 → 下一位置的目标标签</text><text x="240" y="440" fill="#24364A" font-size="22" font-weight="400" text-anchor="start">计算时对齐 logits[:-1] 与 labels[1:]，仅保留有效的回答与结束符目标。</text><text x="240" y="487" fill="#617286" font-size="22" font-weight="400" text-anchor="start">标签为 −100 的位置不计直接损失；提示仍参与注意力与梯度传播。</text><rect x="40" y="580" width="1520" height="540" rx="16" fill="#FFFFFF" stroke="#D1DAE2" stroke-width="1.6"/><text x="70" y="624" fill="#24364A" font-size="28" font-weight="600" text-anchor="start">B   LoRA 冻结主干权重，学习低秩增量</text><text x="70" y="670" fill="#24364A" font-size="25" font-weight="400" text-anchor="start">h = Wx + BAx</text><rect x="110" y="815" width="105" height="70" rx="12" fill="#F8FAFB" stroke="#AEBCC8" stroke-width="1.6"/><text x="162.5" y="858.0" fill="#24364A" font-size="22" font-weight="500" text-anchor="middle">x</text><path d="M215,850 L300,850 L300,745 L620,745" fill="none" stroke="#24364A" stroke-width="2.5" marker-end="url(#ink)"/><rect x="620" y="700" width="300" height="90" rx="12" fill="#EAF0F6" stroke="#567B9C" stroke-width="1.6"/><text x="770.0" y="736.0" fill="#24364A" font-size="22" font-weight="500" text-anchor="middle">原权重 W</text><text x="770.0" y="770.0" fill="#617286" font-size="19" font-weight="400" text-anchor="middle">冻结 · d_out × d_in</text><path d="M920,745 L1130,745 L1130,825" fill="none" stroke="#24364A" stroke-width="2.5" marker-end="url(#ink)"/><path d="M300,850 L300,970 L440,970" fill="none" stroke="#24364A" stroke-width="2.5" marker-end="url(#ink)"/><rect x="440" y="930" width="190" height="80" rx="12" fill="#EAF4EE" stroke="#3D8060" stroke-width="1.6"/><text x="535.0" y="961.0" fill="#24364A" font-size="22" font-weight="500" text-anchor="middle">A</text><text x="535.0" y="995.0" fill="#617286" font-size="19" font-weight="400" text-anchor="middle">r × d_in</text><path d="M630,970 L760,970" fill="none" stroke="#24364A" stroke-width="2.5" marker-end="url(#ink)"/><rect x="760" y="930" width="190" height="80" rx="12" fill="#EAF4EE" stroke="#3D8060" stroke-width="1.6"/><text x="855.0" y="961.0" fill="#24364A" font-size="22" font-weight="500" text-anchor="middle">B</text><text x="855.0" y="995.0" fill="#617286" font-size="19" font-weight="400" text-anchor="middle">d_out × r</text><path d="M950,970 L1130,970 L1130,875" fill="none" stroke="#24364A" stroke-width="2.5" marker-end="url(#ink)"/><circle cx="1130" cy="850" r="24" fill="white" stroke="#24364A" stroke-width="2.5"/><text x="1130" y="858" fill="#24364A" font-size="30" font-weight="400" text-anchor="middle">+</text><path d="M1154,850 L1250,850" fill="none" stroke="#24364A" stroke-width="2.5" marker-end="url(#ink)"/><rect x="1250" y="815" width="220" height="70" rx="12" fill="#F8FAFB" stroke="#AEBCC8" stroke-width="1.6"/><text x="1360.0" y="858.0" fill="#24364A" font-size="22" font-weight="500" text-anchor="middle">输出 h</text><path d="M1360,889 L1360,1080 L855,1080 L855,1012" fill="none" stroke="#B15D54" stroke-width="2.5" marker-end="url(#red)" stroke-dasharray="8 6"/><path d="M855,1080 L535,1080 L535,1012" fill="none" stroke="#B15D54" stroke-width="2.5" marker-end="url(#red)" stroke-dasharray="8 6"/><text x="1190" y="1052" fill="#B15D54" font-size="21" font-weight="400" text-anchor="middle">损失梯度更新 A 与 B</text><text x="70" y="1159" fill="#617286" font-size="21" font-weight="400" text-anchor="start">蓝色：冻结参数  ｜  绿色：可训练参数  ｜  红色虚线：参数更新</text></g></svg>