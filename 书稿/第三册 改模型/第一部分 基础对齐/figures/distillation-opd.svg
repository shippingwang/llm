<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1260" viewBox="0 0 1600 1260" role="img" aria-label="离线回答蒸馏与同策略蒸馏 OPD"><defs><marker id="ink" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#24364A"/></marker><marker id="gray" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#91A1AF"/></marker><marker id="green" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#3D8060"/></marker><marker id="red" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#B15D54"/></marker><marker id="blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#567B9C"/></marker></defs><rect width="1600" height="1260" fill="white"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#24364A"><text x="60" y="62" fill="#24364A" font-size="34" font-weight="600" text-anchor="start">蒸馏中的轨迹来源与监督位置</text><text x="1540" y="62" fill="#617286" font-size="21" font-weight="400" text-anchor="end">Offline KD  /  OPD</text><rect x="40" y="110" width="1520" height="400" rx="16" fill="#FFFFFF" stroke="#D1DAE2" stroke-width="1.6"/><text x="70" y="154" fill="#24364A" font-size="28" font-weight="600" text-anchor="start">A   离线回答蒸馏：学生学习保存的教师回答</text><rect x="80" y="220" width="145" height="70" rx="12" fill="#F8FAFB" stroke="#AEBCC8" stroke-width="1.6"/><text x="152.5" y="263.0" fill="#24364A" font-size="22" font-weight="500" text-anchor="middle">题目 x</text><rect x="300" y="205" width="230" height="100" rx="12" fill="#EAF0F6" stroke="#567B9C" stroke-width="1.6"/><text x="415.0" y="246.0" fill="#24364A" font-size="22" font-weight="500" text-anchor="middle">教师生成回答</text><text x="415.0" y="280.0" fill="#617286" font-size="19" font-weight="400" text-anchor="middle">教师参数固定</text><rect x="610" y="205" width="310" height="100" rx="12" fill="#F8FAFB" stroke="#AEBCC8" stroke-width="1.6"/><text x="765.0" y="246.0" fill="#24364A" font-size="22" font-weight="500" text-anchor="middle">固定教师回答</text><text x="765.0" y="280.0" fill="#617286" font-size="19" font-weight="400" text-anchor="middle">y(T)₁ … y(T)L</text><rect x="1000" y="205" width="230" height="100" rx="12" fill="#EAF4EE" stroke="#3D8060" stroke-width="1.6"/><text x="1115.0" y="246.0" fill="#24364A" font-size="22" font-weight="500" text-anchor="middle">学生读取教师前缀</text><text x="1115.0" y="280.0" fill="#617286" font-size="19" font-weight="400" text-anchor="middle">当前学生 πθ</text><rect x="1320" y="220" width="200" height="70" rx="12" fill="#FAF0E8" stroke="#B88350" stroke-width="1.6"/><text x="1420.0" y="263.0" fill="#24364A" font-size="22" font-weight="500" text-anchor="middle">回答损失</text><path d="M225,255 L300,255" fill="none" stroke="#24364A" stroke-width="2.5" marker-end="url(#ink)"/><path d="M530,255 L610,255" fill="none" stroke="#24364A" stroke-width="2.5" marker-end="url(#ink)"/><path d="M920,255 L1000,255" fill="none" stroke="#24364A" stroke-width="2.5" marker-end="url(#ink)"/><path d="M1230,255 L1320,255" fill="none" stroke="#24364A" stroke-width="2.5" marker-end="url(#ink)"/><path d="M1420,292 L1420,365 L1115,365 L1115,307" fill="none" stroke="#B15D54" stroke-width="2.5" marker-end="url(#red)" stroke-dasharray="8 6"/><text x="1265" y="350" fill="#B15D54" font-size="20" font-weight="400" text-anchor="middle">更新学生</text><text x="610" y="427" fill="#24364A" font-size="23" font-weight="400" text-anchor="start">监督条件：(x，教师回答的前缀)</text><text x="610" y="470" fill="#617286" font-size="21" font-weight="400" text-anchor="start">教师数据保存后，可进行多轮离线训练。</text><rect x="40" y="560" width="1520" height="610" rx="16" fill="#FFFFFF" stroke="#D1DAE2" stroke-width="1.6"/><text x="70" y="604" fill="#24364A" font-size="28" font-weight="600" text-anchor="start">B   OPD：学生生成轨迹，教师在相同前缀上评分</text><rect x="80" y="690" width="145" height="70" rx="12" fill="#F8FAFB" stroke="#AEBCC8" stroke-width="1.6"/><text x="152.5" y="733.0" fill="#24364A" font-size="22" font-weight="500" text-anchor="middle">题目 x</text><rect x="300" y="670" width="250" height="110" rx="12" fill="#F8FAFB" stroke="#AEBCC8" stroke-width="1.6"/><text x="425.0" y="716.0" fill="#24364A" font-size="22" font-weight="500" text-anchor="middle">学生采样</text><text x="425.0" y="750.0" fill="#617286" font-size="19" font-weight="400" text-anchor="middle">本轮参数快照 θ̄</text><rect x="650" y="670" width="300" height="110" rx="12" fill="#F8FAFB" stroke="#AEBCC8" stroke-width="1.6"/><text x="800.0" y="716.0" fill="#24364A" font-size="22" font-weight="500" text-anchor="middle">固定学生轨迹</text><text x="800.0" y="750.0" fill="#617286" font-size="19" font-weight="400" text-anchor="middle">y(S)₁ … y(S)L</text><path d="M225,725 L300,725" fill="none" stroke="#24364A" stroke-width="2.5" marker-end="url(#ink)"/><path d="M550,725 L650,725" fill="none" stroke="#24364A" stroke-width="2.5" marker-end="url(#ink)"/><path d="M800,782 L800,840" fill="none" stroke="#24364A" stroke-width="2.5" marker-end="url(#ink)"/><rect x="650" y="840" width="300" height="70" rx="12" fill="#F8FAFB" stroke="#AEBCC8" stroke-width="1.6"/><text x="800.0" y="883.0" fill="#24364A" font-size="22" font-weight="500" text-anchor="middle">共同前缀 h = (x，y(S)&lt;t)</text><rect x="1050" y="730" width="230" height="90" rx="12" fill="#EAF0F6" stroke="#567B9C" stroke-width="1.6"/><text x="1165.0" y="766.0" fill="#24364A" font-size="22" font-weight="500" text-anchor="middle">教师评分</text><text x="1165.0" y="800.0" fill="#617286" font-size="19" font-weight="400" text-anchor="middle">教师参数固定</text><rect x="1050" y="960" width="230" height="90" rx="12" fill="#EAF4EE" stroke="#3D8060" stroke-width="1.6"/><text x="1165.0" y="996.0" fill="#24364A" font-size="22" font-weight="500" text-anchor="middle">学生重算分布</text><text x="1165.0" y="1030.0" fill="#617286" font-size="19" font-weight="400" text-anchor="middle">当前学生 πθ</text><path d="M950,875 L995,875 L995,775 L1050,775" fill="none" stroke="#24364A" stroke-width="2.5" marker-end="url(#ink)"/><path d="M995,875 L995,1005 L1050,1005" fill="none" stroke="#24364A" stroke-width="2.5" marker-end="url(#ink)"/><path d="M1280,775 L1450,775 L1450,850" fill="none" stroke="#24364A" stroke-width="2.5" marker-end="url(#ink)"/><path d="M1280,1005 L1450,1005 L1450,940" fill="none" stroke="#24364A" stroke-width="2.5" marker-end="url(#ink)"/><rect x="1360" y="850" width="180" height="90" rx="12" fill="#FAF0E8" stroke="#B88350" stroke-width="1.6"/><text x="1450.0" y="886.0" fill="#24364A" font-size="22" font-weight="500" text-anchor="middle">分布损失</text><text x="1450.0" y="920.0" fill="#617286" font-size="19" font-weight="400" text-anchor="middle">KL(pθ ∥ pT)</text><text x="1315" y="752" fill="#567B9C" font-size="18" font-weight="400" text-anchor="middle">pT(·|h)</text><text x="1320" y="1038" fill="#3D8060" font-size="18" font-weight="400" text-anchor="middle">pθ(·|h)</text><path d="M1540,895 L1550,895 L1550,1100 L1165,1100 L1165,1052" fill="none" stroke="#B15D54" stroke-width="2.5" marker-end="url(#red)" stroke-dasharray="8 6"/><text x="1320" y="1132" fill="#B15D54" font-size="20" font-weight="400" text-anchor="middle">仅更新当前学生</text><text x="70" y="1100" fill="#617286" font-size="21" font-weight="400" text-anchor="start">本轮轨迹固定，采样过程不反向传播。</text><path d="M1100,1052 L1100,1200 L425,1200 L425,782" fill="none" stroke="#567B9C" stroke-width="2.5" marker-end="url(#blue)" stroke-dasharray="8 6"/><text x="700" y="1235" fill="#567B9C" font-size="21" font-weight="400" text-anchor="middle">下一轮同步更新后的学生，再重新采样轨迹</text></g></svg>